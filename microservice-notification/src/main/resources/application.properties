server.port=8085
spring.application.name=notification-sla-service

# Logging format
logging.level.com.campus.notification=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([notification-service]){yellow} %clr(---){faint} %clr(%logger{36}){cyan} %clr(:){faint} %m%n
