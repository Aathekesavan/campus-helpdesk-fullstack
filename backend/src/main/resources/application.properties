# SRM INSTITUTE OF SCIENCE AND TECHNOLOGY - TASK 4 FULL STACK PROJECT
# Topic 1: Campus Helpdesk and Maintenance Request System
# Core Backend Service Configuration (Port 8080)
# ===================================================================

server.port=8080
spring.application.name=campus-helpdesk-backend

# H2 In-Memory Relational Database Configuration (CO-3 / CO-5)
spring.datasource.url=jdbc:h2:mem:helpdeskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# SQL Schema Initialization (CO-3 Relational Schema and Seed Data)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.hibernate.ddl-auto=none

# H2 Web Console for Visual Inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Microservice Integration Endpoint (CO-5 Notification & SLA Service)
microservice.notification.url=http://localhost:8085/api/notifications/dispatch

# CORS Configuration
cors.allowed.origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
